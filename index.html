<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GymPro — نظام إدارة الصالة الرياضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#0066FF; --blue-hover:#0052CC; --blue-light:rgba(0,102,255,0.1);
  --cyan:#00D4FF; --cyan-light:rgba(0,212,255,0.1);
  --gold:#F0B429; --gold-hover:#D9960E; --gold-light:rgba(240,180,41,0.1);
  --navy:#070910; --navy-light:#0D1117; --navy-card:#131924; --navy-surface:#1B2331; --navy-elevated:#252F40; --navy-hover:rgba(255,255,255,0.05);
  --navy-sidebar:#070910;
  --text-primary:#F3F7FF; --text-secondary:#AAB4C4; --text-tertiary:#6B7688; --text-muted:#3C4557;
  --border-default:rgba(255,255,255,0.07); --border-hover:rgba(255,255,255,0.14); --border-strong:rgba(255,255,255,0.12);
  --success:#10B981; --warning:#F59E0B; --danger:#F43F5E; --info:#38BDF8; --purple:#8B5CF6;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:22px;
  --font-sans:'Cairo','IBM Plex Sans Arabic',sans-serif; --font-display:'Changa',sans-serif;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
  --shadow-card:0 1px 0 rgba(255,255,255,0.03) inset, 0 10px 24px -14px rgba(0,0,0,0.55);
  --shadow-card-hover:0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 40px -16px rgba(0,0,0,0.65);
  --shadow-pop:0 24px 60px -20px rgba(0,0,0,0.7);
  --fs-caption:12.5px; --fs-label:13.5px; --fs-body:15.5px; --fs-md:17px; --fs-lg:19px; --fs-xl:23px; --fs-2xl:29px; --fs-3xl:38px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-sans); background:var(--navy); color:var(--text-primary);
  font-size:var(--fs-body); font-weight:500; line-height:1.7; overflow:hidden; height:100vh; letter-spacing:0.1px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; line-height:1.25;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08); border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15);}
.font-display{font-family:var(--font-display);}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}

/* Animations */
@keyframes pageEnter{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes modalIn{from{opacity:0; transform:translateY(-18px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes kpiPop{0%{opacity:0; transform:translateY(16px) scale(0.96);} 60%{transform:translateY(-4px) scale(1.01);} 100%{opacity:1; transform:translateY(0) scale(1);}}
@keyframes countUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes slideInUp{from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);}}
@keyframes floatParticle{0%,100%{transform:translateY(0) translateX(0); opacity:0.3;} 33%{transform:translateY(-20px) translateX(10px); opacity:0.6;} 66%{transform:translateY(-10px) translateX(-8px); opacity:0.4;}}
@keyframes pulseBlue{0%,100%{box-shadow:0 0 0 0 rgba(0,102,255,0.35);} 50%{box-shadow:0 0 0 8px rgba(0,102,255,0);}}
@keyframes rippleAnim{to{transform:scale(4); opacity:0;}}
@keyframes fadeOut{from{opacity:1;} to{opacity:0; transform:translateY(-10px);}}
@keyframes toastIn{from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:translateX(0);}}
@keyframes barGrow{from{height:4px; opacity:0.3;}}
@keyframes growWidth{from{width:0 !important;}}
@keyframes loginGlow{0%,100%{box-shadow:0 0 40px rgba(0,102,255,0.2), 0 32px 80px rgba(0,0,0,0.7);} 50%{box-shadow:0 0 60px rgba(0,212,255,0.25), 0 32px 80px rgba(0,0,0,0.7);}}
@keyframes spin{to{transform:rotate(360deg);}}

.animate-page-enter{animation:pageEnter 0.25s ease forwards;}
.animate-kpi-pop{animation:kpiPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity:0;}
.animate-modal-in{animation:modalIn 0.28s ease forwards;}
.animate-count-up{animation:countUp .4s ease forwards;}

/* Login screen */
.login-wrap{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 20% 20%, rgba(0,102,255,0.12), transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(0,212,255,0.10), transparent 50%), var(--navy);
  overflow:hidden;
}
.login-particle{position:absolute; width:4px; height:4px; border-radius:50%; background:var(--cyan); animation:floatParticle var(--dur,8s) ease-in-out infinite var(--delay,0s);}
.login-card{
  position:relative; z-index:2; width:400px; max-width:92vw; background:var(--navy-card);
  border:1px solid var(--border-default); border-radius:var(--radius-xl); padding:40px 34px;
  animation:slideInUp .5s cubic-bezier(0.34,1.2,0.64,1) both, loginGlow 4s ease-in-out infinite 1s;
}
.login-logo{width:64px; height:64px; border-radius:16px; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 8px 30px rgba(0,102,255,0.4); font-size:28px;}

/* Layout */
.app-shell{display:flex; height:100vh; width:100vw; overflow:hidden;}
.sidebar{
  display:flex; flex-direction:column; flex-shrink:0; position:relative;
  overflow-y:auto; overflow-x:hidden; width:250px; background:var(--navy-sidebar);
  margin:14px; height:calc(100vh - 28px); border-radius:22px;
  border:1px solid var(--border-default); box-shadow:0 20px 50px -24px rgba(0,0,0,0.65);
  transition:width .3s cubic-bezier(0.4,0,0.2,1);
}
.sidebar.collapsed{width:64px;}
.sidebar-topcard{margin:18px 16px 10px; border-radius:18px; overflow:hidden; background:rgba(255,255,255,0.035); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%); border:1px solid rgba(255,255,255,0.09); box-shadow:0 10px 32px -14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);}
.sidebar-logo{position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:24px 14px 20px; overflow:hidden;}
.sidebar-logo::before{content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:radial-gradient(rgba(0,212,255,0.35) 1px, transparent 1px);
  background-size:14px 14px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 30%, #000 40%, transparent 90%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 30%, #000 40%, transparent 90%);}
.sidebar-logo > *{position:relative; z-index:1;}
.sidebar.collapsed .sidebar-logo{padding:16px 8px;}
.logo-ring{width:48px; height:48px; background:linear-gradient(135deg,var(--blue),var(--cyan)); border-radius:14px; color:#fff; font-size:21px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 24px rgba(0,102,255,0.3); flex-shrink:0;}
.sidebar-topcard-divider{height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent); margin:0 16px;}
.sidebar-profile-card{display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; transition:.15s; position:relative;}
.sidebar.collapsed .sidebar-profile-card{padding:12px 8px; justify-content:center;}
.sidebar-profile-card:hover{background:rgba(255,255,255,0.045);}
.profile-menu-btn{width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color:var(--text-tertiary); flex-shrink:0; transition:.15s;}
.profile-menu-btn:hover{background:rgba(255,255,255,0.08); color:#fff;}
.profile-dropdown{position:absolute; z-index:50; min-width:190px; top:calc(100% + 6px); inset-inline-end:12px; background:var(--navy-elevated); border:1px solid var(--border-strong); border-radius:14px; box-shadow:var(--shadow-pop); padding:6px; display:none;}
.profile-dropdown.open{display:block;}
.profile-dropdown-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; font-size:var(--fs-body); font-weight:600; color:var(--text-secondary); cursor:pointer; width:100%; background:none; border:none; text-align:start;}
.profile-dropdown-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.profile-dropdown-item.danger{color:var(--danger);}
.profile-dropdown-item.danger:hover{background:rgba(244,63,94,0.1);}
.profile-dropdown-sep{height:1px; background:var(--border-default); margin:5px 4px;}
.avatar-status-wrap{position:relative; flex-shrink:0; display:inline-flex;}
.avatar-status-dot{position:absolute; bottom:-1px; inset-inline-end:-1px; width:11px; height:11px; border-radius:50%; background:var(--success); border:2.5px solid var(--navy-sidebar); box-shadow:0 0 0 0 rgba(16,185,129,0.5); animation:scanPulse 2.2s infinite;}
.nav-group-label{display:flex; align-items:center; justify-content:space-between; width:100%; padding:12px 20px; color:var(--text-tertiary); font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; cursor:pointer; background:none; border:none;}
.nav-group-label:hover{background:rgba(255,255,255,0.04);}
.nav-item{
  display:flex; align-items:center; gap:10px; margin:3px 12px; padding:12px 16px; border-radius:14px;
  font-size:var(--fs-md); font-weight:600; cursor:pointer; color:var(--text-tertiary); background:transparent;
  border:none; width:calc(100% - 24px); text-align:start; transition:all .2s; position:relative;
}
.nav-item:hover{background:rgba(139,92,246,0.1); color:var(--text-primary);}
.nav-item.active{background:linear-gradient(90deg, rgba(139,92,246,0.22), rgba(139,92,246,0.06)); color:#fff; box-shadow:inset 0 0 0 1px rgba(139,92,246,0.25); font-weight:800;}
.nav-item.active::after{content:''; position:absolute; inset-inline-start:-13px; top:50%; transform:translateY(-50%); width:12px; height:24px; border:2px solid var(--purple); border-inline-end:none; border-radius:12px 0 0 12px; opacity:.55;}
.nav-item svg,.nav-item .icon{flex-shrink:0; opacity:.7; color:var(--purple);}
.nav-item.active svg,.nav-item.active .icon{opacity:1;}
.nav-badge{margin-inline-start:auto; background:var(--blue); color:#fff; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:99px; min-width:19px; text-align:center;}
.sidebar-footer{display:flex; align-items:center; justify-content:center; gap:8px; padding:18px 16px; margin-top:auto; cursor:pointer; color:var(--danger); font-weight:700; font-size:var(--fs-body);}
.sidebar-footer:hover{background:rgba(244,63,94,0.06);}
.avatar-circle{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; letter-spacing:.02em; background:linear-gradient(135deg, rgba(16,185,129,0.22), rgba(16,185,129,0.08)); color:#10B981; flex-shrink:0;}

.main-col{flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--border-default); background:var(--navy-light); flex-shrink:0;}
.topbar input.search{flex:1; max-width:380px; background:var(--navy-surface); border:1px solid var(--border-default); border-radius:10px; padding:9px 14px; font-size:var(--fs-body);}
.topbar-user{position:relative; display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border-radius:99px; background:var(--navy-surface); border:1px solid var(--border-default); cursor:pointer; color:var(--text-tertiary); transition:.15s;}
.topbar-user:hover{border-color:var(--border-hover); color:#fff;}
.topbar-user-name{font-size:var(--fs-label); font-weight:700; color:var(--text-primary); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar-user .profile-dropdown{top:calc(100% + 8px); inset-inline-end:0; inset-inline-start:auto;}
.icon-btn{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:var(--navy-surface); border:1px solid var(--border-default); color:var(--text-secondary); position:relative;}
.icon-btn:hover{background:var(--navy-elevated); color:#fff;}
.page-content{flex:1; overflow-y:auto; padding:28px 30px; position:relative;}

/* Subtle animated background for the dashboard — same motif as the login screen, much lower intensity so content stays readable. */
.dash-bg{position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  background:radial-gradient(circle at 15% 10%, rgba(0,102,255,0.05), transparent 45%),
             radial-gradient(circle at 85% 90%, rgba(0,212,255,0.045), transparent 45%);}
.dash-bg .login-particle{opacity:.35; width:3px; height:3px;}
.dash-content{position:relative; z-index:1;}

/* Quick alerts panel */
.alert-item{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:14px; margin-bottom:11px;}
.alert-item .ai-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.alert-item.sev-danger{background:rgba(244,63,94,0.08);} .alert-item.sev-danger .ai-icon{background:rgba(244,63,94,0.16); color:var(--danger);}
.alert-item.sev-warning{background:rgba(245,158,11,0.08);} .alert-item.sev-warning .ai-icon{background:rgba(245,158,11,0.16); color:var(--warning);}
.alert-item.sev-info{background:rgba(0,102,255,0.08);} .alert-item.sev-info .ai-icon{background:rgba(0,102,255,0.16); color:var(--blue);}
.alert-item .ai-title{font-size:var(--fs-label); font-weight:800; color:#fff;}
.alert-item .ai-sub{font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:2px;}

/* Donut chart (pure CSS conic-gradient, no library) */
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center;}
.donut{width:128px; height:128px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative;}
.donut::before{content:''; position:absolute; inset:16px; border-radius:50%; background:var(--navy-card);}
.donut-center{position:relative; z-index:1; text-align:center;}
.donut-center .n{font-size:var(--fs-lg); font-weight:800; font-family:var(--font-display); color:#fff; line-height:1;}
.donut-center .l{font-size:9.5px; color:var(--text-tertiary); margin-top:3px;}
.donut-legend{display:flex; flex-direction:column; gap:8px;}
.donut-legend-item{display:flex; align-items:center; gap:8px; font-size:var(--fs-caption);}
.donut-legend-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
.donut-legend-item .dl-name{color:var(--text-secondary);}
.donut-legend-item .dl-val{color:#fff; font-weight:700; margin-inline-start:auto; padding-inline-start:14px;}

/* Recent operations feed */
.ops-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-default);}
.ops-row:last-child{border-bottom:none;}
.ops-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

/* Trainer mini performance ring */
.tperf-ring{width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative;}
.tperf-ring::before{content:''; position:absolute; inset:4px; border-radius:50%; background:var(--navy-card);}
.tperf-ring span{position:relative; z-index:1; font-size:10px; font-weight:800; color:#fff;}

/* Quick actions grid */
.qa-btn{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; font-size:var(--fs-label); font-weight:800; color:#fff; border:none; cursor:pointer; width:100%; margin-bottom:8px; transition:.15s;}
.qa-btn:hover{filter:brightness(1.12); transform:translateY(-1px);}
.qa-btn:last-child{margin-bottom:0;}

/* Bottom summary bar */
.summary-bar{display:flex; flex-wrap:wrap; gap:0; background:var(--navy-sidebar); border:1px solid var(--border-default); border-radius:var(--radius-lg); margin-top:18px; overflow:hidden;}
.summary-item{flex:1; min-width:150px; display:flex; align-items:center; gap:12px; padding:16px 20px; border-inline-end:1px solid var(--border-default);}
.summary-item:last-child{border-inline-end:none;}
.summary-item .si-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.summary-item .si-val{font-size:var(--fs-lg); font-weight:800; font-family:var(--font-display); color:#fff;}
.summary-item .si-label{font-size:var(--fs-caption); color:var(--text-tertiary);}
.page-header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.page-header h1{font-size:var(--fs-3xl); color:#fff; margin-bottom:4px;}
.page-header .desc{font-size:var(--fs-body); color:var(--text-tertiary); font-weight:500;}
.page-header .meta{font-size:var(--fs-caption); color:var(--text-tertiary); font-weight:600; background:var(--navy-surface); border:1px solid var(--border-default); padding:7px 14px; border-radius:99px; display:inline-flex; align-items:center; gap:6px;}

/* Cards / grids */
.card{background:var(--navy-card); border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);}
.kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--sp-4); margin-bottom:var(--sp-7);}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{position:relative; overflow:hidden; border-radius:var(--radius-lg); padding:22px 22px 20px; background:var(--navy-card); border:1px solid var(--border-default); box-shadow:var(--shadow-card), 0 0 0 1px color-mix(in srgb, var(--kpi-accent, var(--blue)) 22%, transparent); transition:transform .22s cubic-bezier(0.4,0,0.2,1), box-shadow .22s, border-color .22s;}
.kpi-card::before{content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--kpi-accent, var(--blue)); opacity:.9;}
.kpi-card:hover{transform:translateY(-3px); border-color:var(--border-hover); box-shadow:var(--shadow-card-hover), 0 0 0 1px color-mix(in srgb, var(--kpi-accent, var(--blue)) 45%, transparent), 0 0 22px -6px color-mix(in srgb, var(--kpi-accent, var(--blue)) 55%, transparent);}
.kpi-icon{position:relative; display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:13px; margin-bottom:18px;}
.kpi-value{position:relative; font-size:26px; font-weight:800; font-family:var(--font-display); line-height:1; letter-spacing:.2px;}
.kpi-label{position:relative; font-size:12.5px; font-weight:600; color:var(--text-tertiary); margin-top:8px;}
.kpi-trend{position:relative; display:inline-flex; align-items:center; gap:4px; margin-top:13px; font-size:11px; font-weight:700; padding:3.5px 9px; border-radius:99px;}

.section-title{font-size:var(--fs-md); font-weight:800; font-family:var(--font-display); margin-bottom:16px; display:flex; align-items:center; gap:10px; color:var(--text-primary);}
.section-title .bar{width:4px; height:16px; border-radius:99px; background:linear-gradient(180deg,var(--blue),var(--cyan)); flex-shrink:0;}
.section-title .subtitle{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-tertiary); margin-inline-start:auto;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}

table{width:100%; border-collapse:collapse; font-size:var(--fs-body);}
th{text-align:start; padding:10px 14px; font-size:var(--fs-caption); font-weight:700; letter-spacing:.02em; color:var(--text-tertiary); border-bottom:1px solid var(--border-default); background:var(--navy-surface);}
th:first-child{border-radius:8px 0 0 8px;} th:last-child{border-radius:0 8px 8px 0;}
td{padding:13px 14px; border-bottom:1px solid var(--border-default); color:var(--text-secondary);}
tr.tbl-row{transition:background .15s, box-shadow .15s;}
tr.tbl-row:hover td{background:rgba(255,255,255,0.055);}
tr.tbl-row[data-viewtrainer]:hover td,
tr.tbl-row[data-openprivate]:hover td{background:rgba(0,102,255,0.09);}
tr.tbl-row[data-viewtrainer]:hover td:first-child,
tr.tbl-row[data-openprivate]:hover td:first-child{box-shadow:inset 3px 0 0 var(--blue);}
tr.tbl-row:last-child td{border-bottom:none;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:4px 11px; border-radius:99px; font-size:var(--fs-caption); font-weight:700;}
.badge-success{background:rgba(16,185,129,0.12); color:var(--success);}
.badge-warn{background:rgba(245,158,11,0.12); color:var(--warning);}

/* Normalize a local phone number into a wa.me international-format link.
   Strips symbols, drops a leading 0, and prepends the gym's phone prefix (country code). */
/* Generic Excel export helper — rows: array of plain objects (keys become column headers). */
function exportToExcel(rows, filename, sheetName){
  if(!window.XLSX){ (typeof App!=='undefined'?App:{showToast:alert}).showToast('تعذر تحميل مكتبة التصدير، تأكد من الاتصال بالإنترنت', 'error'); return; }
  if(!rows || !rows.length){ App.showToast('لا توجد بيانات للتصدير', 'warning'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'Sheet1');
  XLSX.writeFile(wb, filename);
  App.showToast('تم تصدير الملف بنجاح');
}
function waLink(phone, prefix){
  if(!phone) return '';
  let digits = String(phone).replace(/[^0-9]/g,'');
  if(digits.startsWith('00')) digits = digits.slice(2);
  else if(digits.startsWith('0')) digits = digits.slice(1);
  const cc = String(prefix||'966').replace(/[^0-9]/g,'');
  if(!digits.startsWith(cc)) digits = cc + digits;
  return 'https://wa.me/'+digits;
}

/* ============ DB LAYER ============ */
function getTodayStr(){ return new Date().toISOString().split('T')[0]; }
function genId(prefix){ return (prefix||'id') + Date.now() + Math.random().toString(36).substr(2,5); }
function formatDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString(App.lang==='en'?'en-US':'ar-EG-u-nu-latn',{year:'numeric',month:'short',day:'numeric'}); }
function numAr(n){ return (n||0).toLocaleString(App.lang==='en'?'en-US':'ar-EG-u-nu-latn'); }
function esc(str){ if(!str) return ''; return String(str).replace(/[<>'"]/g, m=>({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[m])); }
/* Two-letter initials for avatars — a single Arabic letter (e.g. "ا") often reads as just a bare stroke,
   so we use the first letter of each of the first two words when available, matching common app conventions. */
function getInitials(name){
  const s = String(name||'').trim();
  if(!s) return '؟';
  const parts = s.split(/\s+/).filter(Boolean);
  if(parts.length>=2) return (parts[0][0]||'')+(parts[1][0]||'');
  return parts[0].slice(0,2);
}
function getAge(dob){
  if(!dob) return '—';
  const b=new Date(dob), t=new Date();
  let age = t.getFullYear()-b.getFullYear();
  const m = t.getMonth()-b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age>=0 ? age+' سنة' : '—';
}

/* Filters transactions by either an explicit from/to date range, or (if no range set) a single YYYY-MM month, or all time if month==='all'. */
function filterTransactionsByPeriod(tx, month, from, to){
  if(from && to) return tx.filter(t=> t.date && t.date>=from && t.date<=to);
  if(month && month!=='all') return tx.filter(t=> t.date && t.date.startsWith(month));

}

function daysSinceDate(dateStr){
  if(!dateStr) return 0;
  const d = new Date(dateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today-d)/86400000);

function getInactiveMembers(members, attendance){

      const ad=new Date((a.date||'')+' '+(a.time||'')), bd=new Date((b.date||'')+' '+(b.time||''));
      return bd-ad;
    });
    const last = recs[0];
    const since = last ? daysSinceDate(last.date) : daysSinceDate(m.startDate);
    return Object.assign({}, m, {daysSince:since, lastDate:last?last.date:null});
  }).filter(m=>m.daysSince>=7).sort((a,b)=>b.daysSince-a.daysSince);

function timeToMinutes(str){ if(!str) return 0; const [h,m] = str.split(':').map(Number); return h*60+(m||0); }
/* Lateness = minutes checked in after the trainer's own shift start.
   Early-leave = minutes checked out before the trainer's own shift end.
   Both count toward the deduction, matching each trainer's individually agreed shift times. */
function calcLateEarly(trainer, checkIn, checkOut){
  const shiftStart = timeToMinutes(trainer.shiftStart||'09:00');
  const shiftEnd = timeToMinutes(trainer.shiftEnd||'17:00');
  const inMin = timeToMinutes(checkIn);
  const outMin = checkOut ? timeToMinutes(checkOut) : null;
  const lateMinutes = Math.max(0, inMin - shiftStart);
  const earlyMinutes = (outMin!==null) ? Math.max(0, shiftEnd - outMin) : 0;
  return { lateMinutes, earlyMinutes, shortfallMinutes: lateMinutes + earlyMinutes };
}
/* Professional tiered deduction based on total lateness + early-leave minutes against the trainer's own shift.
   Up to 2h shortfall → quarter-day deduction, up to 4h → half-day, more → full-day. */
function calcAttendanceDeduction(shortfallMinutes){
  const hours = shortfallMinutes/60;
  if(hours <= 0) return { fraction:0, missing:0, label:'لا يوجد خصم', labelEn:'No deduction' };
  if(hours <= 2) return { fraction:0.25, missing:hours, label:'خصم ربع يوم', labelEn:'Quarter-day deduction' };
  if(hours <= 4) return { fraction:0.5, missing:hours, label:'خصم نص يوم', labelEn:'Half-day deduction' };
  return { fraction:1, missing:hours, label:'خصم يوم كامل', labelEn:'Full-day deduction' };
}
function getTrainerDailyRate(trainer){ return (trainer.salary||0) / 30; }
function getTrainerFinancials(trainer, db){
  const paidSalaries = db.salaryPayments.filter(p=>p.trainerId===trainer.id);
  const totalPaidComm = paidSalaries.reduce((s,p)=>s+(p.commissionAmount||0),0);
  const totalPaidSalary = paidSalaries.reduce((s,p)=>s+(p.salaryAmount||0),0);
  const clients = db.members.filter(m=>m.trainerId===trainer.id);
  const privateClients = db.privateSessions.filter(s=>s.trainerId===trainer.id);
  const subsRevenue = clients.reduce((s,m)=>s+(m.paid||0),0);
  const privateRevenue = privateClients.reduce((s,p)=>{
    const member = db.members.find(m=>m.id===p.clientId);
    return s + (member ? (member.privatePaid||0) : 0);
  },0);
  const totalRevenue = subsRevenue + privateRevenue;
  const totalCommission = Math.round(totalRevenue * (trainer.commissionPct||0) / 100);
  const pendingCommission = Math.max(0, totalCommission - totalPaidComm);
  const ym = getTodayStr().slice(0,7);
  const dailyRate = getTrainerDailyRate(trainer);
  const monthAttendance = db.trainerAttendance.filter(r=>r.trainerId===trainer.id && r.date && r.date.startsWith(ym) && r.checkOut);
  const totalDeductionAmount = Math.round(monthAttendance.reduce((s,r)=>s+((r.deductionFraction||0)*dailyRate),0));
  const totalAdvances = db.transactions.filter(t=>t.category==='سلفة موظف' && t.trainerId===trainer.id && t.date && t.date.startsWith(ym)).reduce((s,t)=>s+(t.amount||0),0);
  const netSalaryAfterDeductions = Math.max(0, (trainer.salary||0) - totalDeductionAmount - totalAdvances);
  return { clients: clients.length, subsRevenue, privateRevenue, totalRevenue, totalCommission, totalPaidComm, totalPaidSalary, pendingCommission, totalDeductionAmount, totalAdvances, netSalaryAfterDeductions, dailyRate };
}

function getMonthClients(db, trainerId, ym){

  const privateSessionsCount = db.privateSessions.filter(ps=>ps.trainerId===trainer.id && ps.startDate && ps.startDate.startsWith(ym)).length;
  return { count:clients.length, income: subsIncome+privateIncome, subsIncome, privateIncome, privateSessionsCount, clients };
}

function getNewMembersGrowth(db, monthsBack){
  monthsBack = monthsBack || 6;
  const now = new Date();
  const pts = [];
  let cumulative = db.members.filter(m=>{
    const created = m.created || m.startDate;
    if(!created) return false;
    const d = new Date(now.getFullYear(), now.getMonth()-monthsBack+1, 1);
    return created < (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01');
  }).length;
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const newThisMonth = db.members.filter(m=>(m.created||m.startDate||'').startsWith(ym)).length;
    cumulative += newThisMonth;
    pts.push({ name:d.toLocaleDateString(App.lang==='en'?'en-US':'ar-EG-u-nu-latn',{month:'short'}), total:cumulative, added:newThisMonth });
  }
  return pts;
}

/* ============ SUPABASE CRUD ============ */
async function sbInsert(table, data) {
  if (!supabaseClient || !SYNC_STATE.isOnline) return { offline: true };
  try { const { data: r, error } = await supabaseClient.from(TABLE_MAP[table] || table).insert(toSB(table, data)).select(); if (error) throw error; return { data: r, error: null }; }
  catch (e) { console.error('SB insert error:', e); return { error: e, offline: true }; }
}
async function sbUpdate(table, data, id) {
  if (!supabaseClient || !SYNC_STATE.isOnline) return { offline: true };
  try { const { data: r, error } = await supabaseClient.from(TABLE_MAP[table] || table).update(toSB(table, data)).eq('id', id).select(); if (error) throw error; return { data: r, error: null }; }
  catch (e) { console.error('SB update error:', e); return { error: e, offline: true }; }
}
async function sbDelete(table, id) {
  if (!supabaseClient || !SYNC_STATE.isOnline) return { offline: true };
  try { const { error } = await supabaseClient.from(TABLE_MAP[table] || table).delete().eq('id', id); if (error) throw error; return { error: null }; }
  catch (e) { console.error('SB delete error:', e); return { error: e, offline: true }; }
}

/* ============ SYNC ============ */
function queueChange(table, data, op) {
  SYNC_STATE.pendingChanges.push({ table, data: JSON.parse(JSON.stringify(data)), op, ts: Date.now() });
  localStorage.setItem('gymproPending', JSON.stringify(SYNC_STATE.pendingChanges));
}

async function syncPending() {
  if (SYNC_STATE.syncInProgress || !SYNC_STATE.isOnline || !supabaseClient) return;
  SYNC_STATE.syncInProgress = true;
  updateSyncStatus('syncing', 'جاري المزامنة...');
  const pending = [...SYNC_STATE.pendingChanges];
  const done = [];
  for (const ch of pending) {
    try {
      let r;
      if (ch.op === 'insert') r = await sbInsert(ch.table, ch.data);
      else if (ch.op === 'update') r = await sbUpdate(ch.table, ch.data, ch.data.id);
      else if (ch.op === 'delete') r = await sbDelete(ch.table, ch.data.id);
      if (!r.error && !r.offline) done.push(ch);
    } catch (e) { console.error('Sync fail:', ch, e); }
  }
  SYNC_STATE.pendingChanges = pending.filter(p => !done.includes(p));
  localStorage.setItem('gymproPending', JSON.stringify(SYNC_STATE.pendingChanges));
  SYNC_STATE.syncInProgress = false;
  updateSyncStatus('online', 'متزامن ✓');
}

/* Lateness = minutes checked in after the trainer's own shift start.
   Early-leave = minutes checked out before the trainer's own shift end.
   Both count toward the deduction, matching each trainer's individually agreed shift times. */
function calcLateEarly(trainer, checkIn, checkOut){
  const shiftStart = timeToMinutes(trainer.shiftStart||'09:00');
  const shiftEnd = timeToMinutes(trainer.shiftEnd||'17:00');
  const inMin = timeToMinutes(checkIn);
  const outMin = checkOut ? timeToMinutes(checkOut) : null;
  const lateMinutes = Math.max(0, inMin - shiftStart);
  const earlyMinutes = (outMin!==null) ? Math.max(0, shiftEnd - outMin) : 0;
  return { lateMinutes, earlyMinutes, shortfallMinutes: lateMinutes + earlyMinutes };
}
/* Professional tiered deduction based on total lateness + early-leave minutes against the trainer's own shift.
   Up to 2h shortfall → quarter-day deduction, up to 4h → half-day, more → full-day. */
function calcAttendanceDeduction(shortfallMinutes){
  const hours = shortfallMinutes/60;
  if(hours <= 0) return { fraction:0, missing:0, label:'لا يوجد خصم', labelEn:'No deduction' };
  if(hours <= 2) return { fraction:0.25, missing:hours, label:'خصم ربع يوم', labelEn:'Quarter-day deduction' };
  if(hours <= 4) return { fraction:0.5, missing:hours, label:'خصم نص يوم', labelEn:'Half-day deduction' };

  const clients = db.members.filter(m=>m.trainerId===trainer.id);
  const privateClients = db.privateSessions.filter(s=>s.trainerId===trainer.id);
  const subsRevenue = clients.reduce((s,m)=>s+(m.paid||0),0);
  const privateRevenue = privateClients.reduce((s,p)=>{
    const member = db.members.find(m=>m.id===p.clientId);
    return s + (member ? (member.privatePaid||0) : 0);
  },0);
  const totalRevenue = subsRevenue + privateRevenue;
  const totalCommission = Math.round(totalRevenue * (trainer.commissionPct||0) / 100);
  const pendingCommission = Math.max(0, totalCommission - totalPaidComm);
  const ym = getTodayStr().slice(0,7);
  const dailyRate = getTrainerDailyRate(trainer);
  const monthAttendance = db.trainerAttendance.filter(r=>r.trainerId===trainer.id && r.date && r.date.startsWith(ym) && r.checkOut);
  const totalDeductionAmount = Math.round(monthAttendance.reduce((s,r)=>s+((r.deductionFraction||0)*dailyRate),0));
  const totalAdvances = db.transactions.filter(t=>t.category==='سلفة موظف' && t.trainerId===trainer.id && t.date && t.date.startsWith(ym)).reduce((s,t)=>s+(t.amount||0),0);
  const netSalaryAfterDeductions = Math.max(0, (trainer.salary||0) - totalDeductionAmount - totalAdvances);
  return { clients: clients.length, subsRevenue, privateRevenue, totalRevenue, totalCommission, totalPaidComm, totalPaidSalary, pendingCommission, totalDeductionAmount, totalAdvances, netSalaryAfterDeductions, dailyRate };
}
/* Members whose subscription started in a given YYYY-MM, for a given trainer (or all trainers if null). */
function getMonthClients(db, trainerId, ym){
  return db.members.filter(m=> (trainerId?m.trainerId===trainerId:!!m.trainerId) && m.startDate && m.startDate.startsWith(ym) );
}
function getTrainerMonthStats(db, trainer, ym){
  const clients = getMonthClients(db, trainer.id, ym);
  const subsIncome = clients.reduce((s,m)=>s+(m.paid||0),0);
  const privateIncome = clients.reduce((s,m)=>s+(m.privatePaid||0),0);
  const privateSessionsCount = db.privateSessions.filter(ps=>ps.trainerId===trainer.id && ps.startDate && ps.startDate.startsWith(ym)).length;
  return { count:clients.length, income: subsIncome+privateIncome, subsIncome, privateIncome, privateSessionsCount, clients };
}
/* ===== Dashboard helpers ===== */
function getNewMembersGrowth(db, monthsBack){
  monthsBack = monthsBack || 6;
  const now = new Date();
  const pts = [];
  let cumulative = db.members.filter(m=>{
    const created = m.created || m.startDate;
    if(!created) return false;
    const d = new Date(now.getFullYear(), now.getMonth()-monthsBack+1, 1);
    return created < (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01');
  }).length;
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const newThisMonth = db.members.filter(m=>(m.created||m.startDate||'').startsWith(ym)).length;
    cumulative += newThisMonth;
    pts.push({ name:d.toLocaleDateString(App.lang==='en'?'en-US':'ar-EG-u-nu-latn',{month:'short'}), total:cumulative, added:newThisMonth });
  }
  return pts;
}
function getPackageDistribution(db){
  const active = db.members.filter(m=>getMemberStatus(m)!=='expired');
  const byPkg = {};
  active.forEach(m=>{
    const pkg = db.packages.find(p=>p.id===m.packageId);
    const name = pkg ? pkg.name : 'بدون باقة';
    byPkg[name] = (byPkg[name]||0)+1;
  });
  const entries = Object.entries(byPkg).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const total = active.length || 1;
  return entries.map(([name,count],i)=>({ name, count, pct:Math.round(count/total*100), color:DONUT_COLORS[i%DONUT_COLORS.length] }));
}
function getRecentOperations(db, limit){
  return db.transactions.slice().reverse().slice(0, limit||6).map(t=>{
    let iconName='dollar', bg='rgba(0,102,255,0.12)', color='var(--blue)';
    if(t.category==='اشتراك جديد'){ iconName='userplus'; bg='rgba(16,185,129,0.12)'; color='var(--success)'; }
    else if(t.category==='تجديد اشتراك'){ iconName='refresh'; bg='rgba(0,212,255,0.12)'; color='var(--cyan)'; }
    else if(t.category==='بريفيت' || t.category==='تجديد بريفيت'){ iconName='award'; bg='rgba(139,92,246,0.12)'; color='var(--purple)'; }
    else if(!t.positive){ iconName='minus'; bg='rgba(244,63,94,0.12)'; color='var(--danger)'; }
    return { desc:t.desc, category:t.category, date:t.date, amount:t.amount, positive:t.positive, iconName, bg, color };

function getTopTrainersPerformance(db, limit){
  const ym = getTodayStr().slice(0,7);
  const active = db.trainers.filter(t=>t.status==='active');
  const withStats = active.map(tr=>{
    const s = getTrainerMonthStats(db, tr, ym);
    const allClients = db.members.filter(m=>m.trainerId===tr.id);
    const attendedThisMonth = allClients.filter(m=> db.attendance.some(a=>a.memberId===m.id && a.type==='in' && a.date && a.date.startsWith(ym)) ).length;
    const rate = allClients.length ? Math.round(attendedThisMonth/allClients.length*100) : 0;
    return { trainer:tr, clients:allClients.length, monthClients:s.count, rate };
  }).sort((a,b)=>b.monthClients-a.monthClients);
  return withStats.slice(0, limit||3);
}
function getAvgDailyAttendance(db, days){
  days = days || 30;
  const now = new Date();
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()-days);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const count = db.attendance.filter(a=>a.type==='in' && a.date>=cutoffStr).length;
  return Math.round(count/days);
}
function getAvailableMonths(db){
  const set = new Set();
  db.members.forEach(m=>{ if(m.startDate) set.add(m.startDate.slice(0,7)); });
  db.privateSessions.forEach(s=>{ if(s.startDate) set.add(s.startDate.slice(0,7)); });
  set.add(getTodayStr().slice(0,7));
  return Array.from(set).sort().reverse();
}

    const openRec = this.db.trainerAttendance.find(r=>r.trainerId===trainerId && r.date===getTodayStr() && !r.checkOut);

  trainerClockOut(trainerId){
    const rec = this.db.trainerAttendance.find(r=>r.trainerId===trainerId && r.date===getTodayStr() && !r.checkOut);
    if(!rec) return {status:'notopen'};
    const now = new Date();

    const [ih,im] = rec.checkIn.split(':').map(Number);
    const [oh,om] = checkOut.split(':').map(Number);
    let hours = (oh+om/60) - (ih+im/60);

    this.recomputeAttendanceDeduction(rec);

  recomputeAttendanceDeduction(rec){

    if(!tr) return;
    const le = calcLateEarly(tr, rec.checkIn, rec.checkOut);
    rec.lateMinutes = le.lateMinutes;
    rec.earlyMinutes = le.earlyMinutes;

  },

  /* --- Settings --- */
  updateSettings(s){ this.db.settings=Object.assign({},this.db.settings,s); this.db.gym=Object.assign({},this.db.gym,s); queueChange('settings', this.db.settings, 'update'); this.persist(); this.showToast('تم تحديث الإعدادات'); syncPending(); },

  /* --- Users --- */
  addUser(u){ const nu=Object.assign({},u,{id:genId('su')}); this.db.systemUsers.push(nu); queueChange('systemUsers', nu, 'insert'); this.persist(); this.showToast('تم إضافة المستخدم'); syncPending(); },
  /* Called after email OTP verification succeeds — creates a pending signup request awaiting admin approval. */
  addPendingUser(u){
    const nu = Object.assign({}, u, {id:genId('pu'), status:'pending', requestedAt:new Date().toISOString()});
    this.db.pendingUsers.push(nu);
    queueChange('pendingUsers', nu, 'insert');
    this.persist(); syncPending();
    return nu;
  },
  approvePendingUser(pendingId, role, perms){
    const idx = this.db.pendingUsers.findIndex(p=>p.id===pendingId);
    if(idx<0) return;
    const pu = this.db.pendingUsers[idx];
    this.addUser({ name:pu.name, username:pu.username, password:pu.password, role:role||'reception', status:'active', perms:perms||{} });
    this.db.pendingUsers.splice(idx,1);
    queueChange('pendingUsers', {id:pu.id}, 'delete');
    this.persist(); syncPending();
    this.showToast('تم اعتماد الحساب بنجاح');
  },
  rejectPendingUser(pendingId){
    this.db.pendingUsers = this.db.pendingUsers.filter(p=>p.id!==pendingId);
    queueChange('pendingUsers', {id:pendingId}, 'delete');
    this.persist(); syncPending();
    this.showToast('تم رفض الطلب');
  },
  updateUser(id,data){ const i=this.db.systemUsers.findIndex(u=>u.id===id); if(i>-1){ this.db.systemUsers[i]=Object.assign({},this.db.systemUsers[i],data); queueChange('systemUsers', this.db.systemUsers[i], 'update'); } this.persist(); this.showToast('تم تحديث المستخدم'); syncPending(); },
  deleteUser(id){ queueChange('systemUsers', {id:id}, 'delete'); this.db.systemUsers=this.db.systemUsers.filter(u=>u.id!==id); this.persist(); this.showToast('تم حذف المستخدم'); syncPending(); },

  /* --- Classes / Schedule --- */
  addClass(c){ const nc=Object.assign({},c,{id:genId('cl')}); this.db.classes.push(nc); queueChange('classes', nc, 'insert'); this.persist(); this.showToast('تم إضافة الفصل'); syncPending(); },
  updateClass(id,data){ const i=this.db.classes.findIndex(c=>c.id===id); if(i>-1){ this.db.classes[i]=Object.assign({},this.db.classes[i],data); queueChange('classes', this.db.classes[i], 'update'); } this.persist(); this.showToast('تم تحديث الفصل'); syncPending(); },
  deleteClass(id){ queueChange('classes', {id:id}, 'delete'); this.db.classes=this.db.classes.filter(c=>c.id!==id); this.db.schedule=this.db.schedule.filter(s=>s.classId!==id); this.persist(); this.showToast('تم حذف الفصل'); syncPending(); },

  /* --- Salary payments --- */
  paySalary(p){ const sp=Object.assign({},p,{id:genId('sp')}); this.db.salaryPayments.push(sp); queueChange('salaryPayments', sp, 'insert'); this.persist(); this.showToast('تم تسجيل الدفعة'); syncPending(); },
};

function loginParticles(n){
  let particles = '';
  for(let i=0;i<n;i++){
    const left = Math.round(Math.random()*100);
    const top = Math.round(Math.random()*100);
    const dur = (6+Math.random()*6).toFixed(1);
    const delay = (Math.random()*4).toFixed(1);
    particles += `<div class="login-particle" style="left:${left}%; top:${top}%; --dur:${dur}s; --delay:${delay}s;"></div>`;
  }
  return particles;
}

function bindLoginEvents(){
  if(authView==='signup-details') return bindSignupDetailsEvents();
  if(authView==='signup-verify') return bindSignupVerifyEvents();
  if(authView==='signup-pending') return bindSignupPendingEvents();
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const ok = App.login(u,p);
    if(!ok){
      const err = document.getElementById('loginError');
      err.style.display='block';
      err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    }
  });
  document.getElementById('goSignupBtn').addEventListener('click', e=>{ e.preventDefault(); authView='signup-details'; render(); });
}
function bindSignupDetailsEvents(){
  document.getElementById('backToLoginBtn').addEventListener('click', e=>{ e.preventDefault(); authView='login'; render(); });
  document.getElementById('signupForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const errEl = document.getElementById('signupError');
    errEl.style.display='none';
    const name = document.getElementById('suName').value.trim();
    const email = document.getElementById('suEmail').value.trim();
    const username = document.getElementById('suUsername').value.trim();
    const password = document.getElementById('suPassword').value;
    const password2 = document.getElementById('suPassword2').value;
    const showErr = (msg)=>{ errEl.textContent = msg; errEl.style.display='block'; };
    if(!name || !email || !username || !password) return showErr('من فضلك املأ كل الحقول');
    if(password.length < 4) return showErr('كلمة المرور قصيرة جداً');
    if(password !== password2) return showErr('كلمتا المرور غير متطابقتين');
    const db = App.db;
    if(db.systemUsers.some(u=>u.username===username) || (db.pendingUsers||[]).some(p=>p.username===username && p.status==='pending')){
      return showErr('اسم المستخدم ده مستخدم بالفعل');
    }
    if(!supabaseClient){ return showErr('التسجيل غير متاح حالياً، يرجى التواصل مع الإدارة'); }
    const btn = document.getElementById('suSubmitBtn');
    btn.disabled = true; btn.textContent = '...جاري الإرسال';
    try{
      const { error } = await supabaseClient.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
      if(error) throw error;
      signupTemp = { name, email, username, password };
      authView = 'signup-verify';
      render();
    }catch(err){
      console.error('OTP send error:', err);
      showErr('تعذر إرسال رمز التحقق، تأكد من صحة البريد الإلكتروني وحاول مرة أخرى');
      btn.disabled = false; btn.innerHTML = `${icon('bell',16)} إرسال رمز التحقق`;
    }
  });
}
function bindSignupVerifyEvents(){
  document.getElementById('backToLoginBtn2').addEventListener('click', e=>{ e.preventDefault(); authView='login'; signupTemp=null; render(); });
  document.getElementById('resendCodeBtn').addEventListener('click', async e=>{
    e.preventDefault();
    if(!signupTemp || !supabaseClient) return;
    try{ await supabaseClient.auth.signInWithOtp({ email:signupTemp.email, options:{ shouldCreateUser:true } }); App.showToast('تم إعادة إرسال الرمز'); }
    catch(err){ App.showToast('تعذر إعادة الإرسال', 'error'); }
  });
  document.getElementById('verifyForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const errEl = document.getElementById('verifyError');
    errEl.style.display='none';
    const code = document.getElementById('verifyCode').value.trim();
    if(!code || !signupTemp) return;
    if(!supabaseClient){ errEl.textContent='التحقق غير متاح حالياً'; errEl.style.display='block'; return; }
    const btn = document.getElementById('verifySubmitBtn');
    btn.disabled = true; btn.textContent = '...جاري التحقق';
    try{
      const { error } = await supabaseClient.auth.verifyOtp({ email:signupTemp.email, token:code, type:'email' });
      if(error) throw error;
      App.addPendingUser(signupTemp);
      signupTemp = null;
      authView = 'signup-pending';
      render();
    }catch(err){
      console.error('OTP verify error:', err);
      errEl.textContent = 'الرمز غير صحيح، حاول مرة أخرى';
      errEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = `${icon('check',16)} تأكيد`;
    }
  });
}
function bindSignupPendingEvents(){
  document.getElementById('backToLoginBtn3').addEventListener('click', ()=>{ authView='login'; render(); });
}

function handleScanResult(result){
  showCheckinNotice(result);
  if(result.status==='success' && App.currentPage==='attendance') refreshPage();
}
function showCheckinNotice(info){
  const root = document.getElementById('checkinNoticeRoot');
  if(!root) return;
  root.innerHTML = '';
  let html;
  if(info.status==='notfound'){
    html = `<div class="checkin-notice duplicate">
      <div class="ci-icon">${icon('alert',20)}</div>
      <div style="flex:1;"><div class="ci-name">${esc(t('memberNotFound_','لا يوجد عضو بهذا الكود'))}</div></div>
      <button class="ci-close" data-ciclose>${icon('x',14)}</button>
    </div>`;
  } else if(info.status){
    const m = info.member;
    const duplicate = info.status==='duplicate';
    const daysLeft = getDaysLeft(m.endDate);
    const daysBg = daysLeft<=3?'rgba(244,63,94,0.12)':daysLeft<=7?'rgba(245,158,11,0.12)':'rgba(16,185,129,0.12)';
    const daysColor = daysLeft<=3?'var(--danger)':daysLeft<=7?'var(--warning)':'var(--success)';
    html = `<div class="checkin-notice ${duplicate?'duplicate':''}">
      <div class="ci-icon">${icon(duplicate?'alert':'check',20)}</div>
      <div style="flex:1;">
        <div class="ci-name">${esc(m.name)}</div>
        <div class="ci-sub">${duplicate?esc(t('alreadyCheckedIn_','مسجّل حضوره اليوم بالفعل')):esc(t('checkedInSuccess_','تم تسجيل الحضور بنجاح'))}</div>
        ${m.remaining>0?`<div class="ci-row" style="background:rgba(245,158,11,0.12); color:var(--warning);">${icon('wallet',13)} ${esc(t('remaining','المتبقي'))}: ${numAr(m.remaining)} ${esc(App.db.settings.currencySymbol)}</div>`:''}
        <div class="ci-row" style="background:${daysBg}; color:${daysColor};">${icon('calendar',13)} ${esc(t('daysLeft','الأيام المتبقية'))}: ${numAr(Math.max(0,daysLeft))} ${esc(t('days','يوم'))}</div>
      </div>
      <button class="ci-close" data-ciclose>${icon('x',14)}</button>
    </div>`;
  } else { return; }
  root.innerHTML = html;
  const el = root.querySelector('.checkin-notice');
  requestAnimationFrame(()=>el.classList.add('show'));
  const dismiss = ()=>{ if(!el.parentNode) return; el.classList.remove('show'); setTimeout(()=>{ if(el.parentNode) el.remove(); }, 300); };
  el.querySelector('[data-ciclose]').addEventListener('click', dismiss);
  setTimeout(dismiss, 6000);
}
/* Barcode scanners act as fast "keyboard typists" — this listens app-wide for that
   rapid-keystroke + Enter signature so scanning works the instant a scanner is plugged in,
   with no pairing step, as long as no other text field currently has focus. */
function setupProfileMenu(){
  document.addEventListener('click', function(e){
    // Toggle: sidebar trigger
    const sideBtn = e.target.closest('#profileMenuBtn');
    if(sideBtn && !e.target.closest('.profile-dropdown')){
      e.stopPropagation();
      const dd = document.getElementById('profileDropdown');
      if(dd) dd.classList.toggle('open');
      const dd2 = document.getElementById('topbarProfileDropdown');
      if(dd2) dd2.classList.remove('open');
      return;
    }
    // Toggle: topbar trigger
    const topBtn = e.target.closest('#topbarProfileMenuBtn');
    if(topBtn && !e.target.closest('.profile-dropdown')){
      e.stopPropagation();
      const dd = document.getElementById('topbarProfileDropdown');
      if(dd) dd.classList.toggle('open');
      const dd1 = document.getElementById('profileDropdown');
      if(dd1) dd1.classList.remove('open');
      return;
    }
    // Logout from either dropdown
    if(e.target.closest('#dropdownLogout') || e.target.closest('#topbarDropdownLogout')){
      e.stopPropagation();
      App.logout();
      return;
    }
    // Clicking a nav item inside a dropdown: let navigation happen, just close the menu after
    if(e.target.closest('.profile-dropdown-item')){
      const dd = document.getElementById('profileDropdown'); if(dd) dd.classList.remove('open');
      const dd2 = document.getElementById('topbarProfileDropdown'); if(dd2) dd2.classList.remove('open');
      return;
    }
    // Click outside: close both
    if(!e.target.closest('.profile-dropdown')){
      const dd = document.getElementById('profileDropdown'); if(dd) dd.classList.remove('open');
      const dd2 = document.getElementById('topbarProfileDropdown'); if(dd2) dd2.classList.remove('open');
    }
  });
}
function setupGlobalScanner(){
  let buffer = '';
  let lastTime = 0;
  document.addEventListener('keydown', function(e){
    const active = document.activeElement;
    const isEditable = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT' || active.isContentEditable);
    if(isEditable || !App.isLoggedIn){ buffer=''; return; }
    const now = Date.now();
    if(now - lastTime > 120) buffer = '';
    lastTime = now;
    if(e.key === 'Enter'){
      if(buffer.length >= 3){ e.preventDefault(); handleScanResult(App.checkInByCode(buffer)); }
      buffer = '';
      return;
    }
    if(e.key.length === 1) buffer += e.key;
  });
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const db = App.db;
  const active = db.members.filter(m=>getMemberStatus(m)==='active');
  const warning = db.members.filter(m=>getMemberStatus(m)==='warning');
  const expired = db.members.filter(m=>getMemberStatus(m)==='expired');
  const debtors = db.members.filter(m=>(m.remaining||0)>0);
  const rev = getMonthlyRevenue(db.transactions);
  const exp = getMonthlyExpenses(db.transactions);
  const net = rev-exp;
  const dayAtt = getTodayAttendance(db.attendance);
  const totalRem = db.members.reduce((s,m)=>s+(m.remaining||0)+(m.privateRemaining||0),0);

  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const r = db.transactions.filter(t=>t.positive && t.date && t.date.startsWith(ym)).reduce((s,t)=>s+t.amount,0);
    months.push({name:d.toLocaleDateString(App.lang==='en'?'en-US':'ar-EG-u-nu-latn',{month:'short'}), revenue:r});
  }
  const maxRev = Math.max(1, ...months.map(m=>m.revenue));
  const barsHtml = months.map((m,i)=>`
    <div class="bar-col">
      <div class="bar-val">${m.revenue>0?numAr(m.revenue):''}</div>
      ${m.revenue>0
        ? `<div class="bar-fill" style="height:${Math.max(10,Math.round(m.revenue/maxRev*140))}px;"></div>`
        : `<div class="bar-fill bar-fill-empty" style="height:6px;"></div>`}
      <div class="bar-label">${esc(m.name)}</div>
    </div>`).join('');

  const growth = getNewMembersGrowth(db, 6);
  const maxGrowth = Math.max(1, ...growth.map(g=>g.total));
  const minGrowth = Math.min(...growth.map(g=>g.total));
  const gw=100, gh=54;
  const growthPts = growth.map((g,i)=>{
    const x = growth.length>1 ? (i/(growth.length-1))*gw : 0;
    const y = gh - ((g.total-minGrowth)/Math.max(1,(maxGrowth-minGrowth)))*gh;
    return `${x},${Math.max(2,y)}`;
  }).join(' ');

  const expiringSoon = db.members.filter(m=>{ const d=getDaysLeft(m.endDate); return d>=0 && d<=7; });
  const recentOps = getRecentOperations(db, 6);
  const donutData = getPackageDistribution(db);
  const donutGradient = (()=>{ let acc=0; return donutData.map(d=>{ const start=acc; acc+=d.pct; return `${d.color} ${start}% ${acc}%`; }).join(', ') || 'var(--navy-surface) 0% 100%'; })();
  const topTrainers = getTopTrainersPerformance(db, 3);
  const avgDaily = getAvgDailyAttendance(db, 30);

/* Quick drill-down summary for a clicked KPI card — shows the latest few related records,
   with a "view all" link to the full page. */
function openKpiDetailModal(kind){
  const db = App.db;
  const CONF = {
    activeMembers:{ title:t('activeMembers','أعضاء نشطون'), icon:'users', color:'var(--blue)', navTo:'members' },
    monthRevenue:{ title:t('monthRevenue','إيرادات الشهر'), icon:'dollar', color:'var(--success)', navTo:'finance' },
    todayAttendance:{ title:t('todayAttendance','حضور اليوم'), icon:'calcheck', color:'var(--cyan)', navTo:'attendance' },
    expiringSoon:{ title:t('expiringSoonLabel','ينتهي قريباً'), icon:'alert', color:'var(--warning)', navTo:'expired' },
    expiredSubs:{ title:t('expiredSubs','اشتراكات منتهية'), icon:'userx', color:'var(--danger)', navTo:'expired' },
    remainingBalances:{ title:t('remainingBalances','مبالغ متبقية'), icon:'wallet', color:'var(--purple)', navTo:'members' },
  }[kind];
  if(!CONF) return;

  let rowsHtml = '';
  if(kind==='activeMembers'){
    const list = db.members.filter(m=>getMemberStatus(m)==='active').slice(-5).reverse();
    rowsHtml = list.map(m=>kpiModalRow(esc(m.name), formatDate(m.startDate), statusText('active'), 'var(--success)')).join('') || kpiModalEmpty();
  } else if(kind==='monthRevenue'){
    const list = db.transactions.filter(t=>t.positive && t.date && t.date.startsWith(getTodayStr().slice(0,7))).slice(-5).reverse();
    rowsHtml = list.map(t=>kpiModalRow(esc(t.desc), formatDate(t.date), '+'+numAr(t.amount)+' '+esc(db.settings.currencySymbol), 'var(--success)')).join('') || kpiModalEmpty();
  } else if(kind==='todayAttendance'){
    const list = db.attendance.filter(a=>a.date===getTodayStr() && a.type==='in').slice(-5).reverse();
    rowsHtml = list.map(a=>kpiModalRow(esc(a.memberName||a.trainerName||'—'), a.time, t('checkIn_','دخول'), 'var(--cyan)')).join('') || kpiModalEmpty();
  } else if(kind==='expiringSoon'){
    const list = db.members.filter(m=>getMemberStatus(m)==='warning').slice(0,5);
    rowsHtml = list.map(m=>kpiModalRow(esc(m.name), formatDate(m.endDate), numAr(getDaysLeft(m.endDate))+' '+t('days','يوم'), 'var(--warning)')).join('') || kpiModalEmpty();
  } else if(kind==='expiredSubs'){
    const list = db.members.filter(m=>getMemberStatus(m)==='expired').slice(0,5);
    rowsHtml = list.map(m=>kpiModalRow(esc(m.name), formatDate(m.endDate), statusText('expired'), 'var(--danger)')).join('') || kpiModalEmpty();
  } else if(kind==='remainingBalances'){
    const list = db.members.filter(m=>(m.remaining||0)>0).sort((a,b)=>(b.remaining||0)-(a.remaining||0)).slice(0,5);
    rowsHtml = list.map(m=>kpiModalRow(esc(m.name), esc(m.code), numAr(m.remaining)+' '+esc(db.settings.currencySymbol), 'var(--purple)')).join('') || kpiModalEmpty();
  }

  openModal(`
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box animate-modal-in" style="max-width:440px;">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:34px; height:34px; border-radius:10px; background:color-mix(in srgb, ${CONF.color} 16%, transparent); color:${CONF.color}; display:flex; align-items:center; justify-content:center;">${icon(CONF.icon,17)}</div>
          <div style="font-weight:800;">${esc(CONF.title)}</div>
        </div>
        <button class="icon-action" id="modalCloseBtn">${icon('x',16)}</button>
      </div>
      <div class="modal-body">
        <div style="font-size:var(--fs-caption); color:var(--text-tertiary); margin-bottom:12px;">${esc(t('latestOps_','آخر العمليات'))}</div>
        <div style="display:flex; flex-direction:column; gap:2px;">${rowsHtml}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="kpiViewMore" style="width:100%; justify-content:center; font-size:var(--fs-caption);">${esc(t('viewMore_','اضغط للمزيد'))} ${icon('chevdown',11)}</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('kpiViewMore').addEventListener('click', ()=>{ closeModal(); App.navigate(CONF.navTo); });
}
function kpiModalRow(title, sub, val, color){
  return `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border-default);">
    <div style="min-width:0;">
      <div style="font-size:var(--fs-body); color:#fff; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${title}</div>
      <div style="font-size:var(--fs-caption); color:var(--text-tertiary);">${sub}</div>
    </div>
    <span style="font-size:var(--fs-caption); font-weight:800; color:${color}; flex-shrink:0;">${val}</span>
  </div>`;
}
function kpiModalEmpty(){ return `<div class="empty-state" style="padding:20px 0;">${icon('check',22)}<div style="margin-top:6px;">لا توجد بيانات</div></div>`; }

function calcEndDate(startDate, durationDays){
  const d = new Date(startDate);
  d.setDate(d.getDate()+Number(durationDays));

}

function bindAddMemberEvents(){
  const db = App.db;
  const pkgSel = document.getElementById('amPkg');
  const startInp = document.getElementById('amStart');
  const endInp = document.getElementById('amEnd');
  const paidInp = document.getElementById('amPaid');
  const remInp = document.getElementById('amRemaining');
  function recalc(){
    const pkg = db.packages.find(p=>p.id===pkgSel.value);
    if(pkg && startInp.value) endInp.value = calcEndDate(startInp.value, pkg.duration);
    const rem = (pkg?pkg.price:0) - (Number(paidInp.value)||0);
    remInp.value = Math.max(0,rem);
    remInp.style.color = rem>0 ? '#F59E0B' : '#10B981';
  }
  pkgSel.addEventListener('change', recalc);
  startInp.addEventListener('change', recalc);
  paidInp.addEventListener('input', recalc);
  recalc();

  document.getElementById('amSave').addEventListener('click', ()=>{
    const name = document.getElementById('amName').value.trim();
    const phone = document.getElementById('amPhone').value.trim();
    const packageId = pkgSel.value;
    const startDate = startInp.value;
    let hasErr = false;
    document.getElementById('errName').style.display='none';
    document.getElementById('errPhone').style.display='none';
    if(!name){ const e=document.getElementById('errName'); e.textContent=t('nameRequired_','الاسم مطلوب'); e.style.display='block'; hasErr=true; }
    if(!phone){ const e=document.getElementById('errPhone'); e.textContent=t('phoneRequired_','الهاتف مطلوب'); e.style.display='block'; hasErr=true; }
    if(hasErr) return;
    const pkg = db.packages.find(p=>p.id===packageId);
    const endDate = calcEndDate(startDate, pkg?pkg.duration:30);
    const paid = Number(paidInp.value)||0;
    const privatePkgId = document.getElementById('amPrivatePkg').value;
    const privatePaid = Number(document.getElementById('amPrivatePaid').value)||0;
    const privatePkg = db.privatePkgs.find(p=>p.id===privatePkgId);
    App.addMember({
      name, phone,
      dob: document.getElementById('amDob').value || undefined,
      gender: document.getElementById('amGender').value,
      address: document.getElementById('amAddress').value || undefined,
      packageId, trainerId: document.getElementById('amTrainer').value || undefined,
      startDate, endDate, paid, remaining: Math.max(0,(pkg?pkg.price:0)-paid),
      payMethod: document.getElementById('amMethod').value,
      notes: document.getElementById('amNotes').value || undefined,
      privatePkgId: privatePkgId || undefined,
      privatePaid: privatePkgId ? privatePaid : undefined,
      privateRemaining: privatePkgId ? Math.max(0,(privatePkg?privatePkg.price:0)-privatePaid) : undefined,
    });
    App.navigate('members');
  });
}

function getExpiredList(){
  const db = App.db;
  let list = db.members.filter(m=>getMemberStatus(m)==='expired').sort((a,b)=>getDaysLeft(a.endDate)-getDaysLeft(b.endDate));
  const q = (App.expiredSearch||'').trim();
  if(q) list = list.filter(m=> m.name.includes(q) || m.phone.includes(q) || (m.code&&m.code.includes(q.toUpperCase())) );
  return list;
}

function renderFollowUp(){

function renderFollowUpTab(tab, expiring, inactive){

  </table></div>`;
}
function bindFollowUpEvents(){
  const db = App.db;

      document.getElementById('fuContent').innerHTML = renderFollowUpTab(btn.getAttribute('data-tab'), expiring, inactive);
    });
  });
}

/* Day-by-day private-package session log modal — ticking off each attended day. */
function openPrivateSessionLogModal(sessionId){
  const db = App.db;
  const s = db.privateSessions.find(x=>x.id===sessionId);
  if(!s) return;
  const member = db.members.find(m=>m.id===s.clientId);
  const completed = s.status==='completed' || s.sessionLog.length>=s.sessionsTotal;
  const daysHtml = Array.from({length:s.sessionsTotal}).map((_,i)=>{
    const done = s.sessionLog[i];
    return `<div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:${done?'rgba(16,185,129,0.08)':'var(--navy-surface)'}; border:1px solid ${done?'rgba(16,185,129,0.25)':'var(--border-default)'};">
      <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:${done?'var(--success)':'var(--navy-elevated)'}; color:${done?'#fff':'var(--text-tertiary)'};">
        ${done?icon('check',14):`<span style="font-size:11px; font-weight:800;">${i+1}</span>`}
      </div>
      <div style="flex:1;">
        <div style="font-size:var(--fs-body); font-weight:700; color:${done?'#fff':'var(--text-tertiary)'};">اليوم ${numAr(i+1)}</div>
        ${done?`<div style="font-size:var(--fs-caption); color:var(--text-tertiary);">${formatDate(done.date)} — سجّله: ${esc(done.loggedBy)}</div>`:`<div style="font-size:var(--fs-caption); color:var(--text-tertiary);">لم يحضر بعد</div>`}
      </div>
    </div>`;
  }).join('');
  openModal(`
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box animate-modal-in" style="max-width:460px;">
      <div class="modal-header">
        <div>
          <div style="font-weight:800;">${esc(member?member.name:s.clientName)}</div>
          <div style="font-size:var(--fs-caption); color:var(--text-tertiary);">${esc(s.packageName)} — ${esc(s.trainerName)}</div>
        </div>
        <button class="icon-action" id="modalCloseBtn">${icon('x',16)}</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <div style="flex:1; height:8px; border-radius:99px; background:var(--navy-surface); overflow:hidden;"><div style="height:100%; width:${Math.min(100,Math.round(s.sessionLog.length/s.sessionsTotal*100))}%; background:${completed?'var(--success)':'linear-gradient(90deg,var(--blue),var(--cyan))'};"></div></div>
          <span style="font-weight:800; font-family:var(--font-display); color:#fff; white-space:nowrap;">${s.sessionLog.length}/${s.sessionsTotal}</span>
        </div>
        ${completed?`<div class="badge badge-success" style="margin-bottom:14px;">${icon('check',12)} اكتمل الاشتراك</div>`:''}
        <div style="display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto;">${daysHtml}</div>
      </div>
      <div class="modal-footer">
        ${!completed?`<button class="btn btn-primary" id="logDayBtn">${icon('check',15)} تسجيل حضور اليوم</button>`:''}
        ${s.sessionLog.length>0?`<button class="btn btn-ghost" id="unlogDayBtn">${icon('x',15)} تراجع عن آخر يوم</button>`:''}
        <button class="btn btn-ghost" id="modalCancelBtn">إغلاق</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  const logBtn = document.getElementById('logDayBtn');
  if(logBtn) logBtn.addEventListener('click', ()=>{ App.logPrivateSessionDay(sessionId); closeModal(); refreshPage(); openPrivateSessionLogModal(sessionId); });
  const unlogBtn = document.getElementById('unlogDayBtn');
  if(unlogBtn) unlogBtn.addEventListener('click', ()=>{ App.unlogPrivateSessionDay(sessionId); closeModal(); refreshPage(); openPrivateSessionLogModal(sessionId); });
}

/* Full drill-down: private revenue, commission, this-month subscriptions, member names + attendance. */

  const db = App.db;
  const t = db.trainers.find(x=>x.id===trainerId);
  if(!t) return;
  const fin = getTrainerFinancials(t, db);
  const ym = getTodayStr().slice(0,7);
  const monthStats = getTrainerMonthStats(db, t, ym);
  const allClients = db.members.filter(m=>m.trainerId===t.id);
  const privateClients = db.privateSessions.filter(s=>s.trainerId===t.id);

  const clientsRows = allClients.map(m=>{
    const status = getMemberStatus(m);
    const attCount = db.attendance.filter(a=>a.memberId===m.id && a.type==='in' && a.date && a.date.startsWith(ym)).length;
    const lastAtt = db.attendance.filter(a=>a.memberId===m.id).slice(-1)[0];
    return `<tr class="tbl-row">
      <td style="color:#fff;">${esc(m.name)}</td>
      <td><span class="badge badge-${status==='active'?'success':status==='warning'?'warn':'danger'}">${statusText(status)}</span></td>
      <td style="text-align:center; font-weight:700; color:var(--cyan);">${numAr(attCount)}</td>
      <td>${lastAtt?formatDate(lastAtt.date):'—'}</td>
    </tr>`;
  }).join('');

  const privRows = privateClients.map(s=>{
    const member = db.members.find(m=>m.id===s.clientId);
    const pct = Math.min(100, Math.round(s.sessionLog.length/s.sessionsTotal*100));
    return `<tr class="tbl-row">
      <td style="color:#fff;">${esc(member?member.name:s.clientName)}</td>
      <td>${esc(s.packageName)}</td>
      <td>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="flex:1; height:6px; border-radius:99px; background:var(--navy-surface); overflow:hidden; min-width:60px;"><div style="height:100%; width:${pct}%; background:${s.status==='completed'?'var(--success)':'linear-gradient(90deg,var(--blue),var(--cyan))'};"></div></div>
          <span style="font-size:var(--fs-caption); color:var(--text-tertiary); white-space:nowrap;">${s.sessionLog.length}/${s.sessionsTotal}</span>
        </div>
      </td>
    </tr>`;
  }).join('');
