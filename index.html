/* ============ TRAINER ATTENDANCE (clock in/out + 8h reception approval) ============ */
function getTrainerAttStatusLabel(status){
  return { pending_checkin:'بانتظار اعتماد الدخول', in_progress:'في العمل — دخول معتمد', pending_checkout:'بانتظار اعتماد الانصراف', approved:'معتمد بالكامل' }[status] || status;
}
function renderTrainerAttendance(){
  const db = App.db;
  const me = App.currentUser;
  const myTrainer = (me && me.role==='trainer' && me.trainerId) ? db.trainers.find(x=>x.id===me.trainerId) : null;
  const myOpenRec = myTrainer ? db.trainerAttendance.find(r=>r.trainerId===myTrainer.id && r.date===getTodayStr() && !r.checkOut) : null;

  const selfCard = myTrainer ? `
  <div class="card scan-card" style="padding:22px; margin-bottom:18px;">
    <div class="card-head">
      <div class="section-title" style="margin:0;"><span class="bar"></span> تسجيل حضوري — ${esc(myTrainer.name)}</div>
      <span class="section-title subtitle" style="margin:0;">${myOpenRec?getTrainerAttStatusLabel(myOpenRec.status):'لم تسجل دخول اليوم'}</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <div style="width:52px; height:52px; border-radius:14px; background:${myOpenRec?'rgba(16,185,129,0.14)':'var(--blue-light)'}; color:${myOpenRec?'var(--success)':'var(--blue)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${icon('clock',24)}</div>
      <div style="flex:1; min-width:180px;">
        ${myOpenRec?`<div style="font-size:var(--fs-body); color:var(--text-secondary);">دخلت الساعة <b style="color:#fff;">${myOpenRec.checkIn}</b>${!myOpenRec.checkInApproved?` — <span style="color:var(--warning);">لسه محتاج اعتماد الريسبشن</span>`:''}</div>`:`<div style="font-size:var(--fs-caption); color:var(--text-tertiary);">وردية اليوم: ${esc(myTrainer.shiftStart)} — ${esc(myTrainer.shiftEnd)}${isTrainerDayOff(myTrainer, getTodayStr())?` — <span style="color:var(--gold);">إجازتك الأسبوعية اليوم 🎉</span>`:''}</div>`}
      </div>
      ${myOpenRec
        ? `<button class="btn btn-danger" id="myClockOutBtn">${icon('x',15)} تسجيل انصراف الآن</button>`
        : `<button class="btn btn-primary" id="myClockInBtn">${icon('scan',15)} تسجيل دخول الآن</button>`}
    </div>
    <div style="font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:10px;">${icon('lock',11)} الوقت بيُسجَّل تلقائياً لحظة الضغط، ولازم الريسبشن يعتمد الدخول والانصراف كل واحد على حدة.</div>
  </div>` : '';

  const todayRecs = db.trainerAttendance.filter(r=>r.date===getTodayStr()).slice().reverse();
  const canApprove = App.currentUser ? App.currentUser.role!=='trainer' : true;
  const canEdit = App.isOwner();

  const reportMonth = App.taReportMonth || getTodayStr().slice(0,7);
  const months = Array.from(new Set(db.trainerAttendance.map(r=>r.date.slice(0,7)).concat([getTodayStr().slice(0,7)]))).sort().reverse();
  const monthRecs = db.trainerAttendance.filter(r=>r.date.startsWith(reportMonth) && r.checkOut);
  const activeTrainers = db.trainers.filter(t=>t.status==='active');
  const reportRows = activeTrainers.map(tr=>{
    const recs = monthRecs.filter(r=>r.trainerId===tr.id);
    const totalHours = Math.round(recs.reduce((s,r)=>s+(r.hours||0),0)*100)/100;
    const totalShortfallMin = recs.reduce((s,r)=>s+(r.lateMinutes||0)+(r.earlyMinutes||0),0);
    const totalDeductionAmt = Math.round(recs.reduce((s,r)=>s+((r.deductionFraction||0)*getTrainerDailyRate(tr)),0));
    return { tr, days:recs.length, totalHours, totalShortfallMin, totalDeductionAmt };
  }).filter(r=>r.days>0 || true);

  return `
  ${selfCard}
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
    <div class="section-title" style="margin:0;"><span class="bar"></span> حضور المدربين — اليوم (${todayRecs.length})</div>
    <button class="btn btn-ghost btn-sm" id="addTrainerAttBtn">${icon('plus',15)} تسجيل بالنيابة عن مدرب</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>المدرب</th><th>دخول</th><th>انصراف</th><th>ساعات العمل</th><th>تأخير/خروج مبكر</th><th>الخصم</th><th>الحالة</th><th></th></tr></thead>
      <tbody>
        ${todayRecs.length ? todayRecs.map(r=>{
          const shortfall = (r.lateMinutes||0)+(r.earlyMinutes||0);
          return `<tr class="tbl-row">
          <td style="color:#fff; font-weight:700;">${esc(r.trainerName)}</td>
          <td>${esc(r.checkIn)} ${r.checkInApproved?`<span title="معتمد" style="color:var(--success);">${icon('check',11)}</span>`:''}</td>
          <td>${r.checkOut?`${esc(r.checkOut)} ${r.checkOutApproved?`<span title="معتمد" style="color:var(--success);">${icon('check',11)}</span>`:''}`:'<span style="color:var(--text-tertiary);">—</span>'}</td>
          <td style="font-weight:700; color:${r.hours>=8?'var(--success)':'var(--text-secondary)'};">${r.hours?numAr(r.hours)+' ساعة':'—'}</td>
          <td style="font-size:var(--fs-caption); color:${shortfall>0?'var(--warning)':'var(--text-tertiary)'};">${r.checkOut?(shortfall>0?`${numAr(Math.round(shortfall))} دقيقة`:'التزام كامل'):'—'}</td>
          <td>${r.checkOut ? (r.deductionFraction>0 ? `<span class="badge badge-danger">${r.deductionLabel}</span>` : `<span class="badge badge-success">${r.deductionLabel||'لا يوجد خصم'}</span>`) : '<span style="color:var(--text-tertiary);">—</span>'}</td>
          <td><span class="badge ${r.status==='approved'?'badge-success':r.status==='in_progress'?'badge-info':'badge-warn'}">${getTrainerAttStatusLabel(r.status)}</span></td>
          <td>
            <div style="display:flex; gap:6px;">
              ${(r.status==='pending_checkin' && canApprove)?`<button class="btn btn-primary btn-sm" data-approvein="${r.id}">${icon('check',13)} اعتماد الدخول</button>`:''}
              ${(r.status==='pending_checkout' && canApprove)?`<button class="btn btn-primary btn-sm" data-approveout="${r.id}">${icon('check',13)} اعتماد الانصراف</button>`:''}
              ${canEdit?`<button class="icon-action" data-editta="${r.id}" title="تعديل يدوي (مالك)">${icon('edit',13)}</button>`:''}
              ${App.can('deleteGeneral')?`<button class="icon-action" data-delta="${r.id}" style="color:var(--danger);" title="حذف">${icon('trash',13)}</button>`:''}
            </div>
          </td>
        </tr>`;
        }).join('') : `<tr><td colspan="8"><div class="empty-state">لا يوجد تسجيلات حضور اليوم</div></td></tr>`}
      </tbody>
    </table>
  </div>
  <div style="margin-top:10px; font-size:var(--fs-caption); color:var(--text-tertiary); display:flex; flex-direction:column; gap:4px;">
    <div>${icon('alert',12)} كل دخول وكل انصراف محتاج اعتماد مستقل من الريسبشن أو المالك قبل ما يتحسب رسمياً.</div>
    <div>${icon('alert',12)} الخصم بيتحسب حسب دقايق التأخير عن ميعاد بداية وردية المدرب + دقايق الخروج قبل نهايتها: لغاية ساعتين = ربع يوم، لغاية 4 ساعات = نص يوم، أكتر = يوم كامل.</div>
    <div>${icon('lock',12)} التعديل اليدوي على أوقات أي سجل متاح لحساب المالك فقط.</div>
  </div>

  <div class="card-head" style="margin-top:28px; margin-bottom:14px;">
    <div class="section-title" style="margin:0;"><span class="bar" style="background:linear-gradient(180deg,var(--gold),var(--gold-hover));"></span> التقرير الشهري للحضور والخصومات</div>
    <select class="f-input" id="taReportMonth" style="width:auto; min-width:170px;">
      ${months.map(m=>`<option value="${m}" ${m===reportMonth?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
    </select>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>المدرب</th><th>أيام الحضور</th><th>إجمالي الساعات</th><th>إجمالي دقائق التأخير/الخروج المبكر</th><th>إجمالي الخصم</th></tr></thead>
      <tbody>
        ${reportRows.length ? reportRows.map(r=>`<tr class="tbl-row">
          <td style="color:#fff; font-weight:700;">${esc(r.tr.name)}</td>
          <td>${numAr(r.days)}</td>
          <td>${numAr(r.totalHours)}</td>
          <td style="color:${r.totalShortfallMin>0?'var(--warning)':'var(--text-tertiary)'};">${numAr(Math.round(r.totalShortfallMin))} دقيقة</td>
          <td style="font-weight:800; color:${r.totalDeductionAmt>0?'var(--danger)':'var(--success)'};">${numAr(r.totalDeductionAmt)}</td>
        </tr>`).join('') : `<tr><td colspan="5"><div class="empty-state">لا توجد بيانات لهذا الشهر</div></td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function bindTrainerAttendanceEvents(){
  const db = App.db;
  const me = App.currentUser;
  const myTrainerId = (me && me.role==='trainer') ? me.trainerId : null;

  const inBtn = document.getElementById('myClockInBtn');
  if(inBtn) inBtn.addEventListener('click', ()=>{
    const r = App.trainerClockIn(myTrainerId);
    if(r.status==='success') App.showToast('تم تسجيل دخولك — بانتظار اعتماد الريسبشن');
    refreshPage();
  });
  const outBtn = document.getElementById('myClockOutBtn');
  if(outBtn) outBtn.addEventListener('click', ()=>{
    const r = App.trainerClockOut(myTrainerId);
    if(r.status==='success'){
      const msg = r.record.deductionFraction>0
        ? `تم تسجيل انصرافك (${r.record.hours} ساعة) — ${r.record.deductionLabel} — بانتظار اعتماد الريسبشن`
        : `تم تسجيل انصرافك (${r.record.hours} ساعة) — بانتظار اعتماد الريسبشن`;
      App.showToast(msg, r.record.deductionFraction>0?'warning':'success');
    }
    refreshPage();
  });
  document.querySelectorAll('[data-approvein]').forEach(el=>{
    el.addEventListener('click', ()=>{ App.approveCheckIn(el.getAttribute('data-approvein')); refreshPage(); });
  });
  document.querySelectorAll('[data-approveout]').forEach(el=>{
    el.addEventListener('click', ()=>{ App.approveCheckOut(el.getAttribute('data-approveout')); refreshPage(); });
  });
  document.querySelectorAll('[data-delta]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-delta');
      confirmAction('حذف السجل','هل تريد حذف سجل الحضور هذا؟', ()=>{ App.deleteTrainerAttendance(id); closeModal(); refreshPage(); });
    });
  });
  document.querySelectorAll('[data-editta]').forEach(el=>{
    el.addEventListener('click', ()=>openEditTrainerAttModal(el.getAttribute('data-editta')));
  });
  const reportSel = document.getElementById('taReportMonth');
  if(reportSel) reportSel.addEventListener('change', ()=>{ App.taReportMonth=reportSel.value; refreshPage(); });
  const addBtn = document.getElementById('addTrainerAttBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    openModal(`
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box animate-modal-in">
        <div class="modal-header"><div style="font-weight:800;">تسجيل حضور/انصراف بالنيابة</div><button class="icon-action" id="modalCloseBtn">${icon('x',16)}</button></div>
        <div class="modal-body">
          <label class="f-label">المدرب</label>
          <select class="f-input" id="taTrainer">${db.trainers.map(tr=>{
            const open = db.trainerAttendance.find(r=>r.trainerId===tr.id && r.date===getTodayStr() && !r.checkOut);
            return `<option value="${tr.id}" data-open="${open?'1':'0'}">${esc(tr.name)} — ${esc(tr.code)} ${open?'(في العمل الآن)':''}</option>`;
          }).join('')}</select>
          <div style="font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:12px; display:flex; align-items:center; gap:6px;">${icon('lock',12)} الوقت هيُسجَّل تلقائياً بالساعة الفعلية الآن، وهيحتاج اعتماد الريسبشن برضه.</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="taClockIn">${icon('scan',15)} تسجيل دخول الآن</button>
          <button class="btn btn-danger" id="taClockOut">${icon('x',15)} تسجيل انصراف الآن</button>
          <button class="btn btn-ghost" id="modalCancelBtn">إلغاء</button>
        </div>
      </div>
    </div>`);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
    document.getElementById('taClockIn').addEventListener('click', ()=>{
      const trId = document.getElementById('taTrainer').value;
      const r = App.trainerClockIn(trId);
      if(r.status==='already_in') App.showToast('المدرب مسجّل دخوله بالفعل اليوم', 'warning');
      else if(r.status==='success') App.showToast('تم تسجيل دخول المدرب الآن');
      closeModal(); refreshPage();
    });
    document.getElementById('taClockOut').addEventListener('click', ()=>{
      const trId = document.getElementById('taTrainer').value;
      const r = App.trainerClockOut(trId);
      if(r.status==='notopen') App.showToast('لا يوجد تسجيل دخول مفتوح لهذا المدرب اليوم', 'error');
      else if(r.status==='success'){
        App.showToast(r.record.deductionFraction>0 ? `تم تسجيل الانصراف — ${r.record.deductionLabel}` : 'تم تسجيل الانصراف بنجاح', r.record.deductionFraction>0?'warning':'success');
      }
      closeModal(); refreshPage();
    });
  });
}

/* ============ MEMBER ATTENDANCE ============ */
function renderAttendance(){
  const db = App.db;
  const todayRaw = db.attendance.filter(a=>a.date===getTodayStr());
  // one row per person per day — keep their earliest check-in time even if scanned/logged multiple times
  const seen = new Set();
  const today = [];
  todayRaw.forEach(a=>{
    const key = a.memberId || a.trainerId || a.memberName;
    if(seen.has(key)) return;
    seen.add(key);
    today.push(a);
  });
  today.reverse();
  return `
  <div class="card scan-card" style="padding:22px; margin-bottom:18px;">
    <div class="card-head">
      <div class="section-title" style="margin:0;"><span class="bar"></span> ${esc(t('quickScan_','المسح السريع'))}</div>
      <span class="section-title subtitle" style="margin:0; display:flex; align-items:center; gap:5px;"><span class="scan-live-dot"></span>${esc(t('scanReady_','جاهز للمسح'))}</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--blue-light); color:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${icon('scan',22)}</div>
      <input class="scan-input" id="scanInput" autocomplete="off" placeholder="${esc(t('scanPlaceholder_','بانتظار المسح...'))}" style="flex:1; min-width:220px;" />
    </div>
    <div style="font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:10px;">${esc(t('quickScanDesc_','المسح شغال في أي صفحة بالبرنامج بمجرد توصيل الجهاز — تسجيل حضور واحد لكل عضو باليوم'))}</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div class="section-title" style="margin:0;"><span class="bar"></span> ${esc(t('todayAttendance_','الحضور والانصراف — اليوم'))} (${today.length})</div>
    <button class="btn btn-ghost btn-sm" id="addAttBtn">${icon('plus',15)} ${esc(t('manualCheckIn_','تسجيل يدوي'))}</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>${esc(t('name','الاسم'))}</th><th>${esc(t('time_','الوقت'))}</th><th>${esc(t('status','حالة الاشتراك'))}</th><th>${esc(t('daysLeft','الأيام المتبقية'))}</th><th>${esc(t('remaining','المبلغ المتبقي'))}</th><th>${esc(t('private_','البريفيت'))}</th><th>${esc(t('checkInType_','النوع'))}</th></tr></thead>
      <tbody>${today.length?today.map(a=>{
        const m = a.memberId ? db.members.find(x=>x.id===a.memberId) : null;
        const status = m ? getMemberStatus(m) : null;
        const daysLeft = m ? getDaysLeft(m.endDate) : null;
        return `<tr class="tbl-row">
        <td style="color:#fff; font-weight:600;">${esc(a.memberName||a.trainerName||'—')}</td>
        <td>${esc(a.time)}</td>
        <td>${m?`<span class="badge badge-${status==='active'?'success':status==='warning'?'warn':'danger'}">${statusText(status)}</span>`:'—'}</td>
        <td>${m?`<span style="color:${daysLeft<=3?'var(--danger)':daysLeft<=7?'var(--warning)':'var(--text-secondary)'}; font-weight:700;">${numAr(Math.max(0,daysLeft))} ${esc(t('days','يوم'))}</span>`:'—'}</td>
        <td>${m?(m.remaining>0?`<span style="color:var(--warning); font-weight:700;">${numAr(m.remaining)} ${esc(db.settings.currencySymbol)}</span>`:`<span style="color:var(--success);">${numAr(0)} ${esc(db.settings.currencySymbol)}</span>`):'—'}</td>
        <td>${m?renderPrivateBadge(db, m.id):'—'}</td>
        <td><span class="badge ${a.type==='in'?'badge-success':'badge-danger'}">${a.type==='in'?esc(t('checkIn_','دخول')):esc(t('checkOut_','خروج'))}</span></td>
      </tr>`;
      }).join(''):`<tr><td colspan="7"><div class="empty-state">${esc(t('noRecordsToday_','لا يوجد تسجيلات اليوم'))}</div></td></tr>`}</tbody>
    </table>
  </div>`;
}
function bindAttendanceEvents(){
  const db = App.db;
  const scanInput = document.getElementById('scanInput');
  if(scanInput){
    scanInput.focus();
    scanInput.addEventListener('keydown', e=>{

        e.preventDefault();
        const code = scanInput.value.trim();
        scanInput.value = '';
        if(!code) return;
        const result = App.checkInByCode(code);
        scanInput.classList.remove('pulse-ok','pulse-err');

        setTimeout(()=>scanInput.classList.remove('pulse-ok','pulse-err'), 900);
        handleScanResult(result);
        setTimeout(()=>{ const el=document.getElementById('scanInput'); if(el) el.focus(); }, 50);
      }
    });
  }
  document.getElementById('addAttBtn').addEventListener('click', ()=>{
    openModal(`
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box animate-modal-in">
        <div class="modal-header"><div style="font-weight:800;">${esc(t('manualCheckIn_','تسجيل حضور يدوي'))}</div><button class="icon-action" id="modalCloseBtn">${icon('x',16)}</button></div>

        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="atSave">${icon('save',15)} ${esc(t('record_','تسجيل'))}</button>
          <button class="btn btn-ghost" id="modalCancelBtn">${esc(t('cancel','إلغاء'))}</button>
        </div>
      </div>
    </div>`);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

      const now = new Date();
      App.addAttendance({ memberId:m.id, memberName:m.name, date:getTodayStr(), time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'), type:document.getElementById('atType').value });

function bindSettingsTabEvents(tab){
  const db = App.db;
  if(tab==='general'){
    const btn = document.getElementById('stSaveGeneral');
    const autoBtn = document.getElementById('autoExportBtn');
    if(autoBtn){
      autoBtn.addEventListener('click', ()=>{
        autoExport();
        this.showToast('تم تصدير النسخة الاحتياطية');
        const ls = document.getElementById('lastSyncTime');
        if(ls) ls.textContent = 'آخر مزامنة: ' + new Date().toLocaleString('ar-EG');
      });
    }
    if(btn) btn.addEventListener('click', ()=>{
      App.updateSettings({ name:document.getElementById('stName').value, adminName:document.getElementById('stAdmin').value, phone:document.getElementById('stPhone').value, address:document.getElementById('stAddress').value, hours:document.getElementById('stHours').value, currencySymbol:document.getElementById('stCurrency').value, phonePrefix:document.getElementById('stCountryCode').value });
      refreshPage();
    });
    const logoBtn = document.getElementById('stLogoBtn');
    const logoFile = document.getElementById('stLogoFile');
    if(logoBtn && logoFile){
      logoBtn.addEventListener('click', ()=>logoFile.click());
      logoFile.addEventListener('change', ()=>{
        const file = logoFile.files[0];
        if(!file) return;
        if(file.size > 1024*1024){ App.showToast('حجم الصورة كبير، الرجاء اختيار صورة أقل من 1 ميجابايت', 'error'); return; }
        const reader = new FileReader();
        reader.onload = ()=>{
          App.updateSettings({ logoUrl: reader.result });
          App.showToast('تم تحديث شعار الصالة');
          refreshPage();
          const sidebarEl = document.querySelector('.sidebar');
          if(sidebarEl){ const followupCount = App.db.members.filter(m=>{ const d=getDaysLeft(m.endDate); return d<=7; }).length; sidebarEl.outerHTML = renderSidebar(followupCount); document.querySelectorAll('[data-nav]').forEach(el=>{ el.addEventListener('click', ()=> App.navigate(el.getAttribute('data-nav')) ); }); document.querySelectorAll('[data-togglegroup]').forEach(el=>{ el.addEventListener('click', ()=> App.toggleGroup(el.getAttribute('data-togglegroup')) ); }); }
        };
        reader.readAsDataURL(file);
      });
    }
    const logoReset = document.getElementById('stLogoReset');
    if(logoReset) logoReset.addEventListener('click', ()=>{
      App.updateSettings({ logoUrl:null });
      refreshPage();
    });
  } else if(tab==='notifications'){
    document.querySelectorAll('[data-notif]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const n = Object.assign({}, db.settings.notifications);
        n[el.getAttribute('data-notif')] = el.checked;
        App.updateSettings({ notifications:n });
      });
    });
  } else {
    const addBtn = document.getElementById('addUserBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>openUserModal(null));
    document.querySelectorAll('[data-edituser]').forEach(el=>el.addEventListener('click', ()=>openUserModal(el.getAttribute('data-edituser'))));
    document.querySelectorAll('[data-deluser]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-deluser');
        confirmAction('حذف المستخدم','هل تريد حذف هذا المستخدم؟', ()=>{ App.deleteUser(id); closeModal(); refreshPage(); });
      });
    });
    document.querySelectorAll('[data-approve-pending]').forEach(el=>{
      el.addEventListener('click', ()=>openApprovePendingModal(el.getAttribute('data-approve-pending')));
    });
    document.querySelectorAll('[data-reject-pending]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-reject-pending');
        confirmAction('رفض الطلب','هل تريد رفض طلب إنشاء هذا الحساب؟', ()=>{ App.rejectPendingUser(id); closeModal(); refreshPage(); });
      });
    });
  }
}

        </div>

          <div class="section-title" style="margin:0 0 10px; font-size:var(--fs-body);"><span class="bar" style="background:linear-gradient(180deg,var(--gold),var(--gold-hover));"></span> ${esc(t('generalActionPerms_','صلاحيات عامة على البرنامج'))}</div>
          <div class="perms-grid" id="usActionPermsGrid" style="grid-template-columns:1fr; ${isOwner?'opacity:.45; pointer-events:none;':''}">
            ${actionPermsHtml}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="usSave">${icon('save',15)} ${esc(t('save','حفظ'))}</button>
        <button class="btn btn-ghost" id="modalCancelBtn">${esc(t('cancel','إلغاء'))}</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  const roleSel = document.getElementById('usRole');
  const permsGrid = document.getElementById('usPermsGrid');
  const actionPermsGrid = document.getElementById('usActionPermsGrid');
  const permsHint = document.getElementById('usPermsHint');
  roleSel.addEventListener('change', ()=>{
    const ownerNow = roleSel.value==='owner';
    permsGrid.style.opacity = ownerNow ? '.45' : '1';
    permsGrid.style.pointerEvents = ownerNow ? 'none' : 'auto';
    actionPermsGrid.style.opacity = ownerNow ? '.45' : '1';
    actionPermsGrid.style.pointerEvents = ownerNow ? 'none' : 'auto';
    permsHint.textContent = ownerNow ? t('ownerFullAccess','المالك لديه كل الصلاحيات') : '';
    document.getElementById('usTrainerLinkWrap').style.display = roleSel.value==='trainer' ? '' : 'none';
  });
  document.getElementById('usSave').addEventListener('click', ()=>{
    const newPerms = {};
    document.querySelectorAll('.usPerm').forEach(el=>{ newPerms[el.getAttribute('data-perm')] = el.checked; });
    const trainerIdEl = document.getElementById('usTrainerId');
    const data = { name:document.getElementById('usName').value, username:document.getElementById('usUsername').value, password:document.getElementById('usPassword').value, role:roleSel.value, status:'active', perms:newPerms, trainerId: roleSel.value==='trainer' ? (trainerIdEl.value||null) : null };
    if(id) App.updateUser(id,data); else App.addUser(data);
    closeModal(); refreshPage();
  });
}

/* ============ SCHEDULE ============ */
const WEEK_DAYS = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function renderSchedule(){
  const db = App.db;
  return `
  <div class="section-title"><span class="bar"></span> جدول الحصص الأسبوعي</div>
  <div class="card" style="overflow-x:auto; padding:16px;">
    <div style="display:grid; grid-template-columns:repeat(7,minmax(140px,1fr)); gap:10px; min-width:900px;">
      ${WEEK_DAYS.map(day=>{
        const items = db.schedule.filter(s=>s.day===day).sort((a,b)=>a.time.localeCompare(b.time));
        return `<div>
          <div style="text-align:center; font-weight:800; color:#fff; font-size:13.5px; padding:8px 0; border-bottom:2px solid var(--blue); margin-bottom:8px;">${day}</div>
          ${items.length ? items.map(s=>{
            const cls = db.classes.find(c=>c.id===s.classId);
            const trainer = cls ? db.trainers.find(t=>t.id===cls.trainerId) : null;
            return `<div style="background:var(--navy-surface); border:1px solid var(--border-default); border-radius:10px; padding:10px; margin-bottom:8px;">
              <div style="font-size:13.5px; font-weight:800; color:var(--cyan);">${s.time}</div>
              <div style="font-size:14.5px; font-weight:700; color:#fff; margin-top:2px;">${cls?esc(cls.name):'—'}</div>
              <div style="font-size:12.5px; color:var(--text-tertiary); margin-top:2px;">${trainer?esc(trainer.name):''}</div>
            </div>`;
          }).join('') : `<div style="text-align:center; font-size:12.5px; color:var(--text-muted); padding:14px 0;">لا يوجد</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function bindScheduleEvents(){}

/* ============ CLASSES ============ */
function renderClasses(){
  const db = App.db;
  return `
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div class="section-title" style="margin:0;"><span class="bar"></span> إدارة الفصول (${db.classes.length})</div>
    <button class="btn btn-primary btn-sm" id="addClassBtn">${icon('plus',15)} فصل جديد</button>
  </div>
  <div class="grid3">
    ${db.classes.map(c=>{
      const trainer = db.trainers.find(t=>t.id===c.trainerId);
      const pct = Math.round((c.enrolled/c.capacity)*100);
      return `<div class="card" style="padding:18px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div style="font-weight:800; color:#fff; font-size:15px;">${esc(c.name)}</div>
            <div style="font-size:13.5px; color:var(--text-tertiary); margin-top:2px;">${trainer?esc(trainer.name):'—'} — ${esc(c.time)}</div>
          </div>
        </div>
        <div style="margin-top:14px;">
          <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-tertiary); margin-bottom:5px;"><span>الإشغال</span><span>${c.enrolled}/${c.capacity}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:linear-gradient(90deg,var(--blue),var(--cyan));"></div></div>
        </div>
        <div style="font-size:12.5px; color:var(--text-tertiary); margin-top:10px;">${(c.days||[]).join(' • ')}</div>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn btn-ghost btn-sm" data-editclass="${c.id}" style="flex:1; justify-content:center;">${icon('edit',13)} تعديل</button>
          <button class="btn btn-danger btn-sm" data-delclass="${c.id}" style="justify-content:center;">${icon('trash',13)}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function bindClassesEvents(){
  document.getElementById('addClassBtn').addEventListener('click', ()=>openClassModal(null));
  document.querySelectorAll('[data-editclass]').forEach(el=>el.addEventListener('click', ()=>openClassModal(el.getAttribute('data-editclass'))));
  document.querySelectorAll('[data-delclass]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-delclass');
      confirmAction('حذف الفصل','هل تريد حذف هذا الفصل؟', ()=>{ App.deleteClass(id); closeModal(); refreshPage(); });
    });
  });
}
function openClassModal(id){
  const db = App.db;
  const c = id ? db.classes.find(x=>x.id===id) : {name:'',trainerId:db.trainers[0]?db.trainers[0].id:'',capacity:20,enrolled:0,time:'06:00',days:[]};
  openModal(`
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box animate-modal-in">
      <div class="modal-header"><div style="font-weight:800;">${id?'تعديل':'إضافة'} فصل</div><button class="icon-action" id="modalCloseBtn">${icon('x',16)}</button></div>
      <div class="modal-body">
        <div class="grid2">
          <div style="grid-column:1/-1;"><label class="f-label">اسم الفصل</label><input class="f-input" id="clName" value="${esc(c.name)}" /></div>
          <div><label class="f-label">المدرب</label><select class="f-input" id="clTrainer">${db.trainers.map(t=>`<option value="${t.id}" ${t.id===c.trainerId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
          <div><label class="f-label">الوقت</label><input type="time" class="f-input" id="clTime" value="${c.time}" /></div>
          <div><label class="f-label">السعة</label><input type="number" class="f-input" id="clCapacity" value="${c.capacity}" /></div>
          <div><label class="f-label">المسجلون</label><input type="number" class="f-input" id="clEnrolled" value="${c.enrolled}" /></div>
          <div style="grid-column:1/-1;"><label class="f-label">الأيام</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              ${WEEK_DAYS.map(d=>`<label style="display:flex; align-items:center; gap:5px; font-size:13.5px; background:var(--navy-surface); border:1px solid var(--border-default); padding:6px 10px; border-radius:8px; cursor:pointer;"><input type="checkbox" class="clDay" value="${d}" ${(c.days||[]).includes(d)?'checked':''} style="accent-color:var(--blue);" /> ${d}</label>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="clSave">${icon('save',15)} حفظ</button>
        <button class="btn btn-ghost" id="modalCancelBtn">إلغاء</button>
      </div>
    </div>
  </div>`);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('clSave').addEventListener('click', ()=>{
    const days = Array.from(document.querySelectorAll('.clDay:checked')).map(el=>el.value);
    const data = { name:document.getElementById('clName').value, trainerId:document.getElementById('clTrainer').value, time:document.getElementById('clTime').value, capacity:Number(document.getElementById('clCapacity').value)||0, enrolled:Number(document.getElementById('clEnrolled').value)||0, days };
    if(id) App.updateClass(id,data); else App.addClass(data);
    closeModal(); refreshPage();
  });
}

/* ============ USER PROFILE ============ */
function renderUserProfile(){
  const db = App.db;
  const u = App.currentUser || { name:db.gym.adminName, username:'admin', role:'owner' };
  return `
  <div style="max-width:520px; margin:0 auto;">
    <div class="card" style="padding:28px; text-align:center;">
      <div class="avatar-circle" style="width:80px; height:80px; font-size:30px; margin:0 auto 16px; background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#fff;">${esc(getInitials(u.name))}</div>
      <div style="font-size:19px; font-weight:900; color:#fff; font-family:var(--font-display);">${esc(u.name)}</div>
      <div style="font-size:14.5px; color:var(--text-tertiary); margin-top:4px;">${roleLabel(u.role)} — ${esc(u.username)}</div>
      <div style="display:flex; justify-content:center; gap:24px; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-default);">
        <div><div style="font-size:20px; font-weight:800; color:#fff;">${db.members.length}</div><div style="font-size:12.5px; color:var(--text-tertiary);">أعضاء</div></div>
        <div><div style="font-size:20px; font-weight:800; color:#fff;">${db.trainers.length}</div><div style="font-size:12.5px; color:var(--text-tertiary);">مدربون</div></div>
        <div><div style="font-size:20px; font-weight:800; color:#fff;">${numAr(getMonthlyRevenue(db.transactions))}</div><div style="font-size:12.5px; color:var(--text-tertiary);">إيراد الشهر</div></div>
      </div>
      <button class="btn btn-danger" id="upLogout" style="margin-top:24px; width:100%; justify-content:center;">${icon('logout',15)} تسجيل الخروج</button>
    </div>
  </div>`;
}
function bindUserProfileEvents(){
  const btn = document.getElementById('upLogout');
  if(btn) btn.addEventListener('click', ()=>App.logout());
}

/* ============ INIT ============ */
async function initApp(){
  try{
    App.db = await loadDB();
  }catch(e){
    console.error('loadDB failed, falling back to defaults:', e);
    App.db = JSON.parse(JSON.stringify(DEFAULTS));
  }
  applyDocDir();
  setupGlobalScanner();
  setupProfileMenu();
  render();
}
initApp();
</script>
</body>
</html>
